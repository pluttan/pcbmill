# PCB design rules for the mill (pcbmill: make rules-publish): a static page
# with the PDF and the KiCad DRC rules, on its own port of the VDS that serves
# Quartus and Questa on 8443.
# Install: /etc/nginx/sites-available/pcb.conf, link into sites-enabled,
# nginx -t && systemctl reload nginx.
server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    server_name 157.22.189.111 pluttan.fvds.ru _;
    ssl_certificate     /etc/letsencrypt/live/157.22.189.111/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/157.22.189.111/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/pcb;
    index index.html;
    charset utf-8;
    types { text/html html; application/pdf pdf; text/plain kicad_dru; }
    default_type text/plain;
    location / { try_files $uri $uri/ =404; }
}
