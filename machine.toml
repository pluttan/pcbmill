# Профиль станка. Все размеры в мм, подачи в мм/мин.
# Значения по умолчанию сняты с Vesi_v3/v4.tap, которые на этом станке уже шли.

[machine]
dialect  = "grbl"    # grbl | mach3 | linuxcnc: как писать щуп и смену инструмента
spindle  = 8000      # об/мин
spinup   = 2         # пауза после M3, с
safe_z   = 4.0       # переезды между участками
travel_z = 1.0       # короткие переезды между соседними контурами
park     = [0, 0]    # куда уехать в конце
# пределы для проверки программ (pcbmill check); уточнить по станку
limits      = [300, 180, 45]   # ход X, Y, Z от нуля, мм
max_feed    = 1000             # мм/мин
max_spindle = 12000            # об/мин

[board]
thickness = 1.5      # толщина заготовки
origin    = "corner" # corner: левый нижний угол контура платы = X0 Y0; gerber: координаты как в файлах
margin    = 0.0      # отступ угла платы от нуля (сдвигает всё на +margin по X и Y)
# blank   = [100, 100]  # размер заготовки: проверка, что рез на ней помещается

# ---- инструменты ----
# type = "vbit":    ширина реза = tip + 2·depth·tan(angle/2)
# type = "endmill": ширина реза = diameter

[tools.vbit]
type   = "vbit"
tip    = 0.1
angle  = 45
plunge = 200
feed   = 300

[tools.vcut]
type   = "vbit"
tip    = 0.2
angle  = 30
plunge = 100
feed   = 200

# ---- операции ----

[isolation]
tool    = "vbit"
depth   = 0.1        # медь 18–35 мкм, 0.1 с запасом на неровность
passes  = 2          # число обходов вокруг меди
overlap = 0.3        # перекрытие соседних обходов, доля ширины реза

[drill]
tool  = "vbit"
mode  = "spot"       # spot: наколка под ручное сверление; through: насквозь (нужно настоящее сверло)
depth = 0.4          # глубина наколки
peck  = 0.5          # для through: шаг клевка

[cutout]
tool       = "vcut"
mode       = "score" # score: V-канавка по контуру, плату потом ломают; mill: фреза по контуру с перемычками
depth      = 0.8     # итоговая глубина
stepdown   = 0.2     # за один проход
tabs       = 4       # перемычки, только для mill
tab_width  = 2.0
tab_height = 0.6
