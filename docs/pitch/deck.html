<script>
const s = [...document.querySelectorAll('.slide')];
const cur = () => Math.round(scrollY / innerHeight);
addEventListener('keydown', e => {
  let i = cur();
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) i++;
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) i--;
  else if (e.key === 'Home') i = 0;
  else if (e.key === 'End') i = s.length - 1;
  else return;
  e.preventDefault();
  s[Math.max(0, Math.min(s.length - 1, i))].scrollIntoView();
});
</script>
